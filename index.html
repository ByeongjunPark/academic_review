<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학술분과 자문의견서</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<main id="app">
  <section id="login" class="card narrow">
    <h1>학술분과 자문의견서</h1>
    <p class="sub">경남교육청 AI 디지털 교육지원단 · 이슈 리포트 검토</p>
    <form id="loginForm">
      <label>위원 이름
        <select id="loginName" required><option value="">선택하세요</option></select>
      </label>
      <label>비밀번호
        <input id="loginPw" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary">들어가기</button>
      <p id="loginMsg" class="msg"></p>
    </form>
  </section>

  <section id="editor" hidden>
    <header class="top">
      <div>
        <h1>자문의견서 <span id="whoName"></span></h1>
        <p class="sub" id="whoInfo"></p>
      </div>
      <button id="logout" class="ghost">나가기</button>
    </header>

    <div id="status" class="status" hidden></div>

    <div class="card">
      <div class="grid2">
        <label>소속 <input id="sosok" placeholder="예: ○○고등학교"></label>
        <label>직위 <input id="jikwi" placeholder="예: 교사"></label>
      </div>
    </div>

    <p class="hint">검토일자는 기본값으로 채워져 있습니다. 복무상 겹치는 일이 있으면 날짜와 시작 시각을 바꾸세요(검토 시간은 3시간 단위). 각 호마다 <b>▣ 소제목</b>과 그 아래 <b>- 활동내용</b>을 1개 이상 적어 주세요.</p>

    <div id="reviews"></div>

    <div class="actions">
      <button id="saveBtn" class="ghost">임시저장</button>
      <button id="submitBtn" class="primary">제출</button>
    </div>
    <p id="actionMsg" class="msg"></p>
  </section>
</main>

<template id="tplReview">
  <div class="card review">
    <div class="rv-head">
      <h2 class="rv-title"></h2>
      <span class="rv-meta"></span>
    </div>
    <div class="rv-when">
      <label>검토일 <input type="date" class="rv-date"></label>
      <label>시간 <select class="rv-start"></select></label>
      <button type="button" class="link rv-reset">기본값</button>
    </div>
    <div class="sections"></div>
    <button type="button" class="link add-sec">+ 소제목 추가</button>
  </div>
</template>

<template id="tplSection">
  <div class="sec">
    <div class="sec-row">
      <span class="mark">▣</span>
      <input class="sec-title" placeholder="소제목">
      <button type="button" class="x del-sec" title="소제목 삭제">×</button>
    </div>
    <div class="items"></div>
    <button type="button" class="link add-item">+ 활동내용 추가</button>
  </div>
</template>

<template id="tplItem">
  <div class="item">
    <span class="mark">-</span>
    <textarea class="item-text" rows="1" placeholder="활동내용"></textarea>
    <button type="button" class="x del-item" title="삭제">×</button>
  </div>
</template>

<script src="config.js?v=1"></script>
<script src="lib/jszip.min.js"></script>
<script src="hwpx.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
